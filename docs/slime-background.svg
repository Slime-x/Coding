<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbfcfe"/>
      <stop offset="100%" stop-color="#f4f6fa"/>
    </linearGradient>

    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#87CEEB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#87CEEB" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1D11C2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1D11C2" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6C0703" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6C0703" stop-opacity="0"/>
    </radialGradient>

    <filter id="soften" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>

    <filter id="softenSm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <!-- reusable 4-point sparkle -->
    <g id="star">
      <path d="M0,-14 C1,-4 4,-1 14,0 C4,1 1,4 0,14 C-1,4 -4,1 -14,0 C-4,-1 -1,-4 0,-14 Z" fill="#ffffff"/>
    </g>
  </defs>

  <!-- base wash -->
  <rect width="1920" height="1080" fill="url(#base)"/>

  <!-- ambient color blobs, echoing the header/logo palette -->
  <circle cx="220" cy="180" r="420" fill="url(#blob1)" filter="url(#soften)"/>
  <circle cx="1750" cy="150" r="380" fill="url(#blob2)" filter="url(#soften)"/>
  <circle cx="1650" cy="920" r="460" fill="url(#blob1)" filter="url(#soften)"/>
  <circle cx="120" cy="960" r="360" fill="url(#blob3)" filter="url(#soften)"/>
  <circle cx="960" cy="540" r="520" fill="url(#blob2)" filter="url(#soften)" opacity="0.35"/>

  <!-- faint indigo-to-skyblue ribbon, echoing the button/nav gradient -->
  <path d="M-100,700 C400,600 700,850 1200,700 C1600,580 1800,700 2020,650"
        stroke="url(#blob2)" stroke-width="140" fill="none" opacity="0.15" filter="url(#soften)"/>

  <!-- scattered sparkles, matching the "slime" avatar's star motif -->
  <g filter="url(#softenSm)">
    <use href="#star" x="180" y="120" transform="scale(1.4)" opacity="0.9"/>
    <use href="#star" x="340" y="260" transform="scale(0.8)" opacity="0.7"/>
    <use href="#star" x="90" y="420" transform="scale(1.1)" opacity="0.6"/>
    <use href="#star" x="620" y="90" transform="scale(0.7)" opacity="0.8"/>
    <use href="#star" x="1500" y="140" transform="scale(1.3)" opacity="0.85"/>
    <use href="#star" x="1720" y="300" transform="scale(0.9)" opacity="0.6"/>
    <use href="#star" x="1850" y="80" transform="scale(0.6)" opacity="0.7"/>
    <use href="#star" x="1600" y="500" transform="scale(1.0)" opacity="0.5"/>
    <use href="#star" x="80" y="700" transform="scale(1.2)" opacity="0.7"/>
    <use href="#star" x="250" y="880" transform="scale(0.8)" opacity="0.6"/>
    <use href="#star" x="1780" y="750" transform="scale(1.1)" opacity="0.75"/>
    <use href="#star" x="1550" y="950" transform="scale(0.7)" opacity="0.6"/>
    <use href="#star" x="1900" y="980" transform="scale(0.9)" opacity="0.55"/>
    <use href="#star" x="960" y="60" transform="scale(0.6)" opacity="0.5"/>
    <use href="#star" x="1050" y="1000" transform="scale(0.7)" opacity="0.5"/>
    <use href="#star" x="480" y="980" transform="scale(1.0)" opacity="0.6"/>
    <use href="#star" x="420" y="150" transform="scale(0.5)" opacity="0.5"/>
    <use href="#star" x="1350" y="700" transform="scale(0.6)" opacity="0.45"/>
  </g>
</svg>
